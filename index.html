function technique(k){let b=root(k), moves={ch:['M115 60L155 60','M115 60L190 60',35,0],lat:['M115 28L185 28','M115 80L185 80',0,52],leg:['M155 120L180 80','M195 120L220 80',40,0],curl:['M150 110L190 110','M150 110L150 150',-30,30],calf:['M155 145L200 145','M155 125L200 125',0,-20],row:['M150 80L205 80','M105 80L160 80',-45,0],shoulder:['M115 65L185 65','M115 20L185 20',0,-45],abs:['M105 45L145 45','M120 85L160 85',15,40],hip:['M100 120L170 120','M100 90L170 90',0,-30],side:['M100 100L150 100','M100 55L150 55',0,-45],rear:['M100 80L150 80','M140 80L190 80',40,0],core:['M100 100L180 100','M100 100L180 100',0,0]};let m=moves[b];return `<p>${E[k][6]}</p>${k===b&&m?`<svg class="motion" viewBox="0 0 280 165" aria-label="Условная схема направления движения"><rect x="8" y="8" width="264" height="149" rx="16" fill="#24282c"/><path d="${m[0]}" stroke="#77818b" stroke-width="12" stroke-linecap="round"/><path d="${m[1]}" stroke="#d9fa68" stroke-width="3" stroke-dasharray="5 5" fill="none"/><path class="moving" style="--dx:${m[2]}px;--dy:${m[3]}px" d="${m[0]}" stroke="#d9fa68" stroke-width="8" stroke-linecap="round"/><text x="140" y="153" text-anchor="middle" font-size="10">Условное направление движения</text></svg>`:''}<small>Схема не заменяет инструкцию на конкретном тренажёре. Для нового оборудования попроси тренера проверить настройку.</small>`}

function food(){let d=date(),a=s.food.filter(x=>x.date===d),k=a.reduce((n,x)=>n+x.k,0),p=a.reduce((n,x)=>n+x.p,0);return `<section class="hero-start"><div class="exercise-num">NUTRITION / TODAY</div><h2>Питание сегодня</h2><div class="grid"><div class="metric"><small>Ккал</small><b>${Math.round(k)}</b></div><div class="metric"><small>Остаток ккал</small><b>${Math.round(s.calGoal-k)}</b></div><div class="metric"><small>Белок, г</small><b>${Math.round(p)}</b></div></div><p class="muted">Жиры: ${Math.round(a.reduce((n,x)=>n+(x.f||0),0))} г · Углеводы: ${Math.round(a.reduce((n,x)=>n+(x.c||0),0))} г (по заполненным записям)</p><p class="muted">Цель: ${s.calGoal} ккал · ${s.proteinGoal} г белка</p><div class="bar"><i style="width:${Math.min(100,k/s.calGoal*100)}%"></i></div></section><section><h2>Добавить продукт</h2><label>Название</label><input id="fn" style="width:100%" placeholder="Куриная грудка"><div class="foodgrid" style="margin-top:10px">${[['fk','Ккал за порцию'],['fp','Белок, г'],['ff','Жиры, г'],['fc','Углеводы, г']].map(([id,l])=>`<div><label>${l}</label><input id="${id}" type="number" min="0" step="0.1" inputmode="decimal"></div>`).join('')}</div><p><button class="primary" onclick="addFood()">Добавить</button></p><small>Вводи значения на съеденную порцию. Жиры и углеводы можно оставить пустыми.</small></section><section><h2>Дневник питания</h2>${[...s.food].reverse().map(x=>`<div class="plan-card"><div class="row between"><b>${esc(x.name)}</b><button onclick="removeFood(${s.food.indexOf(x)})" aria-label="Удалить">×</button></div><small>${esc(x.date)} · ${x.k} ккал · Б ${x.p} г · Ж ${x.f??'—'} · У ${x.c??'—'}</small></div>`).join('')||'<p class="muted">Записей пока нет.</p>'}</section>`}

function plan(){return `<section><h2>12 недель · Full Body A/B</h2><p>Неделя 1: A–B–A; неделя 2: B–A–B. Первые 2 недели — по 2 рабочих подхода, если восстановление недостаточное. Далее используй объём в таблице. Не работай до отказа.</p></section>`+Object.entries(P).map(([p,ks])=>`<section><h2>Тренировка ${p}</h2>${ks.filter(k=>s.profile7?.equipment?.[k]!=='skip').map(k=>s.preferred[k]||k).map(k=>`<div class="plan-card"><b>${E[k][0]}</b><small>${E[k][1]}</small><div class="load">${s.weights[k]==null?'Подбор веса':s.weights[k]+' кг'} · ${E[k][5]} × ${E[k][3]}–${E[k][4]} ${root(k)==='core'?'сек/стор.':''}</div><small>${recommendation(k)}</small>${progression6(k)}<details><summary>Как выполнять</summary>${guidePanel8(k)}</details><br><select class="full-width" aria-label="Выбор тренажёра" onchange="s.preferred['${root(k)}']=this.value;save();render()">${[root(k),...ALT[root(k)].map((_,i)=>root(k)+'x'+i)].map(x=>`<option value="${x}" ${x===k?'selected':''}>${E[x][0]}</option>`).join('')}</select><small>Замены: ${[root(k),...ALT[root(k)].map((_,i)=>root(k)+'x'+i)].filter(x=>x!==k).map(x=>E[x][0]).join(' · ')}</small></div>`).join('')}</section>`).join('')+`<section><h2>Покрытие мышц</h2><table>${[['Грудь','A + B'],['Широчайшие и средняя часть спины','A + B'],['Передняя / средняя / задняя дельта','A + B'],['Бицепс и трицепс','В тягах и жимах'],['Квадрицепсы, ягодицы','A + B'],['Задняя поверхность бедра','A'],['Икры','A'],['Корпус','A + B']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table><p class="muted">Отдельная нагрузка на руки необязательна. Приоритет — восстановление и техника. При боли в груди, необычной одышке или головокружении прекрати нагрузку.</p></section>`}

function chart(a){if(!a.length)return '<p>Нет данных</p>';let min=Math.min(...a.map(x=>x.y)),max=Math.max(...a.map(x=>x.y));let xy=a.map((x,i)=>[35+i*300/Math.max(1,a.length-1),20+(max-x.y)*110/Math.max(1,max-min)]);return `<svg viewBox="0 0 360 165" role="img" aria-label="График динамики"><path d="M35 15V135H340" fill="none" stroke="#aab6c1"/><polyline points="${xy.map(x=>x.join(',')).join(' ')}" fill="none" stroke="#d9fa68" stroke-width="3"/>${xy.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="4" fill="#d9fa68"/>${i===0||i===a.length-1?`<text x="${x}" y="${y-8}" font-size="11" text-anchor="middle" fill="#172331">${a[i].y}</text>`:''}`).join('')}<text x="35" y="153" font-size="10">${esc(a[0].d)}</text><text x="340" y="153" text-anchor="end" font-size="10">${esc(a.at(-1).d)}</text></svg>`}
function progress(){let a=[...s.body].sort((a,b)=>a.date.localeCompare(b.date));return `<section><h2>Вес и талия</h2><div class="row"><div><label>Дата</label><input id="bd" type="date" value="${date()}"></div><div><label>Вес, кг</label><input id="bw" type="number" step="0.1" min="1" style="width:95px" value="${latest().weight}"></div><div><label>Талия, см</label><input id="bt" type="number" step="0.1" min="1" style="width:95px"></div></div><p><button class="primary" onclick="bodyAdd()">Сохранить замер</button></p>${chart(a.map(x=>({d:x.date,y:x.weight})))}<h3>Талия</h3>${chart(a.filter(x=>x.waist!=null).map(x=>({d:x.date,y:x.waist})))}<p class="muted">Взвешивайся утром; оценивай тренд за несколько недель, а не отдельное измерение.</p></section><section><h2>Силовой прогресс</h2><select id="ex" onchange="strength(this.value)">${Object.keys(E).map(k=>`<option value="${k}">${E[k][0]}</option>`).join('')}</select><div id="strength">${strengthChart('ch')}</div></section>`}function strengthChart(k){return chart([...s.history].sort((a,b)=>a.date.localeCompare(b.date)).filter(h=>h.sets[k]?.some(x=>x.r!=null)).map(h=>({d:h.date,y:Math.max(...h.sets[k].filter(x=>x.r!=null).map(x=>x.w))})))+'<small>Максимальный фактически выполненный вес за тренировку; сравнивай вместе с повторениями и запасом.</small>'}function strength(k){document.getElementById('strength').innerHTML=strengthChart(k)}function bodyAdd(){let d=document.getElementById('bd').value,w=Number(document.getElementById('bw').value),t=document.getElementById('bt').value;if(!d||w<=0||(t&&Number(t)<=0))return alert('Проверь значения');s.body=s.body.filter(x=>x.date!==d);s.body.push({date:d,weight:w,waist:t?Number(t):null});save();render()}
function settings(){return `<section><h2>Рабочие веса</h2><p class="muted">Изменяй после оценки техники и RIR. Пустое значение — подбор на месте.</p>${Object.keys(E).map(k=>`<div class="row between" style="margin:8px 0"><span>${E[k][0]}</span><input aria-label="${E[k][0]}" type="number" min="0" step="0.5" style="width:85px" value="${s.weights[k]??''}" onchange="weightEdit('${k}',this.value)"></div>`).join('')}<label>Цель калорий, ккал</label><input type="number" min="1" value="${s.calGoal}" onchange="if(+this.value>0){s.calGoal=+this.value;save()}"><label>Цель белка, г</label><input type="number" min="1" value="${s.proteinGoal}" onchange="if(+this.value>0){s.proteinGoal=+this.value;save()}"><label>Целевой вес тела</label><input type="number" min="1" value="${s.goal}" onchange="if(+this.value>0){s.goal=+this.value;save();render()}"></section><section><h2>Хранение на iPhone</h2><p>Локальное сохранение зависит от браузера. Просмотр HTML через «Файлы» может не поддерживать историю. Для надёжного переноса сохраняй JSON в «Файлы» / iCloud Drive.</p><div class="row"><button onclick="shareBackup()">Поделиться копией</button></div><h2 style="margin-top:20px">Резервная копия</h2><p>Данные хранятся в браузере. Экспортируй их регулярно: очистка браузера или открытие в другом приложении может привести к потере истории.</p><div class="row"><button onclick="exportData()">Экспорт JSON</button><button onclick="document.getElementById('imp').click()">Импорт JSON</button><input id="imp" hidden type="file" accept=".json,application/json" onchange="importData(this.files[0])"></div><p><label>Перенос через текст JSON</label><textarea id="pasteBackup" placeholder="Вставь резервную копию"></textarea></p><div class="row"><button onclick="importText()">Импорт текста</button><button onclick="copyBackup()">Копировать данные</button></div></section>`}function weightEdit(k,v){if(v!==''&&(!Number.isFinite(+v)||+v<0))return;s.weights[k]=v===''?null:+v;save()}async function shareBackup(){let f=new File([JSON.stringify(s,null,2)],'fitness_backup_'+date()+'.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){if(e.name!=='AbortError')exportData()}}else exportData()}function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.href=u;a.download='fitness_backup_'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(f){if(!f)return;try{let x=JSON.parse(await f.text());if(x.v!==1||!Array.isArray(x.history)||!Array.isArray(x.body)||!x.weights||!x.history.every(h=>h.sets&&Object.values(h.sets).every(Array.isArray)))throw Error();if(confirm('Заменить текущие данные резервной копией?')){s=migrate(x);save();render()}}catch{alert('Некорректный файл резервной копии')}}function startTimer(n){document.getElementById('timerPanel').hidden=false;end=Date.now()+n*1000;tick()}function stopTimer(){document.getElementById('timerPanel').hidden=true;end=0;document.getElementById('clock').textContent='00:00'}function tick(){if(!end)return;let n=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById('clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(!n){end=0;if(navigator.vibrate)navigator.vibrate(250)}}setInterval(tick,250);

function calendar6(){let y=month6.getFullYear(),m=month6.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),days=Array.from({length:n},(_,i)=>{let d=y+'-'+String(m+1).padStart(2,'0')+'-'+String(i+1).padStart(2,'0'),a=s.history.filter(x=>x.date===d);return '<button class="day6 '+(a.length?'hit6':'')+'" onclick="document.getElementById(\'filter6\').value=\''+d+'\';filter6()">'+(i+1)+(a.length?'<small>'+a.length+'</small>':'')+'</button>'}).join('');return '<section><div class="row between"><button onclick="month6.setMonth(month6.getMonth()-1);render()">‹</button><b>'+month6.toLocaleDateString('ru',{month:'long',year:'numeric'})+'</b><button onclick="month6.setMonth(month6.getMonth()+1);render()">›</button></div><div class="calendar6">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<small>'+x+'</small>').join('')+'<span></span>'.repeat(off)+days+'</div><label>Фильтр истории</label><input id="filter6" type="date" onchange="filter6()"><button onclick="document.getElementById(\'filter6\').value=\'\';filter6()">Все</button></section>'}

function saveHistory6(i){let h=s.history[i],d=document.getElementById('edate6').value;if(!d)return;let sets={};for(let [k,a] of Object.entries(h.sets)){sets[k]=[];for(let j=0;j<a.length;j++){let v=p=>document.getElementById(p+'6_'+k+'_'+j).value,w=v('w'),r=v('r'),rir=v('i');if(w===''||!Number.isFinite(+w)||+w<0||(r!==''&&(!Number.isInteger(+r)||+r<1))||(rir!==''&&(!Number.isInteger(+rir)||+rir<0)))return alert('Проверь вес, повторы и запас');sets[k].push({...a[j],w:+w,r:r===''?null:+r,rir:rir===''?null:+rir})}}s.history[i]={...h,date:d,sets};edit6=-1;save();render()}

function load6(){let d=new Date();d.setDate(d.getDate()-6);let since=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),hits={};for(let h of s.history.filter(x=>x.date>=since&&x.date<=date()))for(let [k,a] of Object.entries(h.sets))for(let g of groups[root(k)]||[])hits[g]=(hits[g]||0)+a.length;return '<section><h2>Нагрузка за 7 дней</h2>'+[...new Set(Object.values(groups).flat())].map(g=>'<div class="row between"><span>'+g+'</span><b>'+(hits[g]||0)+'</b></div><div class="bar"><i style="width:'+Math.min(100,(hits[g]||0)/Math.max(1,...Object.values(hits))*100)+'%"></i></div>').join('')+'<small>Подходы с участием мышцы, включая косвенную нагрузку. Не оценка восстановления.</small></section>'}

function profile7(){let p=s.profile7||{},opt=(v,n,cur)=>'<option value="'+v+'" '+(v===cur?'selected':'')+'>'+n+'</option>',num=(id,label,v,min,max)=>'<label>'+label+'</label><input id="'+id+'" type="number" min="'+min+'" max="'+max+'" value="'+esc(v??'')+'">';return '<section class="profile7"><div class="exercise-num">PERSONAL PROFILE</div><h2>Настрой свой FIT</h2><p class="muted">Для взрослых. Данные остаются на устройстве. Анкета необязательна.</p><div class="profilegrid7">'+num('age7','Возраст',p.age,18,85)+num('height7','Рост, см',p.height,120,230)+num('weight7','Вес, кг',latest().weight==='—'?'':latest().weight,35,300)+'<div><label>Пол для расчёта энергозатрат</label><select id="sex7">'+opt('','Выбрать',p.sex||'')+opt('m','Мужской',p.sex)+opt('f','Женский',p.sex)+'</select></div><div><label>Цель</label><select id="goal7">'+opt('loss','Снижение веса',p.goal||'loss')+opt('maintain','Поддержание',p.goal)+opt('gain','Набор массы',p.goal)+'</select></div><div><label>Опыт</label><select id="level7">'+opt('begin','Начинающий',p.level||'begin')+opt('regular','Регулярно тренируюсь',p.level)+'</select></div><div><label>Тренировок в неделю</label><select id="freq7">'+[2,3,4].map(n=>opt(String(n),n,String(p.freq||3))).join('')+'</select></div><div><label>Активность вне зала</label><select id="activity7">'+opt('1.2','Сидячая',String(p.activity||1.2))+opt('1.375','Умеренная',String(p.activity))+opt('1.55','Активная',String(p.activity))+'</select></div></div><h3>Оборудование</h3><p class="muted">Выбери доступный вариант каждого движения или пропусти его.</p>'+Object.keys(P.A.concat(P.B).reduce((a,k)=>(a[k]=1,a),{})).map(k=>'<div class="equipment7"><label>'+E[k][0]+'</label><select id="equip7_'+k+'">'+[k,...ALT[k].map((_,i)=>k+'x'+i),'skip'].map(v=>opt(v,v==='skip'?'Нет подходящего оборудования':E[v][0],p.equipment?.[k]||s.preferred[k]||k)).join('')+'</select></div>').join('')+'<p><button class="primary" onclick="saveProfile7()">Применить профиль</button> <button onclick="s.profileDismiss7=true;save();render()">Позже</button></p><small>Расчёт калорий ориентировочный, не медицинское назначение. При беременности, заболеваниях или специальных диетах согласуй цели со специалистом.</small></section>'}
function saveProfile7(){let v=id=>document.getElementById(id).value,age=+v('age7'),height=+v('height7'),weight=+v('weight7'),sex=v('sex7'),goal=v('goal7'),level=v('level7'),freq=+v('freq7'),activity=+v('activity7');if(age<18||age>85||height<120||height>230||weight<35||weight>300||!sex)return alert('Укажи корректные возраст, рост, вес и пол');let equipment={};for(let k of new Set([...P.A,...P.B]))equipment[k]=v('equip7_'+k);let bmr=10*weight+6.25*height-5*age+(sex==='m'?5:-161),maintenance=bmr*activity,cal=Math.round((maintenance+(goal==='loss'?-Math.min(400,maintenance*.15):goal==='gain'?200:0))/50)*50,protein=Math.round(Math.min(weight,goal==='loss'?Math.max(1,25*(height/100)**2):weight)*1.6/5)*5;cal=Math.max(sex==='m'?1500:1200,cal);let msg='Оценка калорий: '+cal+' ккал, белок: '+protein+' г. Применить новые цели питания?';if(confirm(msg)){s.calGoal=cal;s.proteinGoal=protein}if(!s.body.length)s.body.push({date:date(),weight,waist:null});if(!s.history.length&&!s.profile7)s.goal=Math.round(goal==='loss'?weight*.95:goal==='gain'?weight*1.03:weight);s.profile7={age,height,weight,sex,goal,level,freq,activity,equipment,maintenance:Math.round(maintenance)};s.profileDismiss7=true;for(let [k,n] of Object.entries(equipment))if(n!=='skip')s.preferred[k]=n;save();render()}
function profileSummary7(){let p=s.profile7;if(!p)return '';return '<section><div class="exercise-num">YOUR PLAN</div><h3>'+({loss:'Снижение веса',maintain:'Поддержание формы',gain:'Набор мышечной массы'}[p.goal])+'</h3><p>'+p.freq+' тренировки в неделю · '+(p.level==='begin'?'Адаптация':'Регулярная нагрузка')+'</p><p class="muted">Оценка поддержания: '+p.maintenance+' ккал/сут. Корректируй по динамике веса за 2–3 недели. Оставляй минимум день отдыха между силовыми, если не восстанавливаешься.</p></section>'}
