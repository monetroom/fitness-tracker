*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172331;font:15px system-ui,Arial}main{max-width:760px;margin:auto;padding:18px 14px 100px}h1{font-size:26px;margin:4px 0}h2{font-size:19px}h3{font-size:16px;margin:0}small,.muted{color:#64748b}button,input,select{font:inherit;border:1px solid #d7dfe8;border-radius:10px;padding:10px;background:white;color:inherit;min-width:0}button{cursor:pointer}button.primary{background:#205b49;color:white;border:0}button:disabled{opacity:.45}button.active{background:#172331;color:white}section,.card{background:white;border:1px solid #e0e5eb;border-radius:16px;padding:14px;margin:12px 0}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#edf3f1;padding:12px;border-radius:12px}.metric b{display:block;font-size:23px}.tabs{display:flex;gap:6px;overflow:auto;margin:18px 0}.tabs button{white-space:nowrap;flex:1}.set{display:grid;grid-template-columns:30px 1fr 1fr 1fr 45px;gap:6px;align-items:center;margin:8px 0}.set input,.set select{width:100%;padding:9px 5px}.done{background:#d9eee4!important}.tag{display:inline-block;background:#edf1f5;border-radius:7px;padding:4px 8px;font-size:12px}.timer{position:sticky;bottom:8px;z-index:4;box-shadow:0 4px 24px #0002;background:#172331;color:white;border:0}.timer button{color:#172331}.timer strong{font-size:25px;font-variant-numeric:tabular-nums}.bar{height:7px;background:#e6ecea;border-radius:10px;overflow:hidden}.bar i{display:block;background:#39836b;height:100%}details{margin-top:10px}summary{cursor:pointer;color:#526576}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px 4px;border-bottom:1px solid #e9edf1}svg{width:100%;height:auto}label{display:block;font-size:12px;color:#64748b} .danger{color:#a23b32} @media(max-width:380px){main{padding:10px}.set{gap:3px;grid-template-columns:24px 1fr 1fr 1fr 38px}.set button .tabs svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.timer{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:628px;margin:0;padding:10px 14px;background:#282c32f7;z-index:8;border-radius:18px;box-shadow:0 8px 32px #0005}.timer strong{color:var(--accent);font-size:26px}.timer button{font-size:13px;min-height:40px;padding:8px}.timer[hidden]{display:none}.set{grid-template-columns:24px 1fr 1fr 1fr 44px;gap:6px}.set input,.set select{font-size:16px;min-height:44px}.set button{font-size:20px;padding:4px}.set:has(.done){background:#242d1d;border-radius:12px}.swap select{font-size:16px}.storage{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#b8bdc6;margin:13px 2px 6px}.storage b{color:var(--accent)}.storage.bad b{color:#ffb2a8}.exercise-num{font-size:10px;font-weight:700;letter-spacing:1.4px;color:#a2a8b1}.plan-card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.plan-card b{font-size:16px}.plan-card .load{font-size:23px;font-weight:750;color:var(--accent);letter-spacing:-.6px}.plan-card small{display:block;margin:4px 0}.hero-start{background:linear-gradient(145deg,#29321e,#1b1d22 65%)}.hero-start button.primary{width:100%;margin-top:12px;padding:14px}.hero-start .row button{flex:1}.foodgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.foodgrid input{width:100%}.foodgrid label{margin-bottom:5px}.muted,small,label,summary{color:#a7abb5}svg text{fill:#bfc5ce}.danger{color:#ffb2a8} @media(max-width:390px){main{padding-left:12px;padding-right:12px}section{padding:13px}.set{gap:4px}.metric b{font-size:20px}}
</style><main><header><small>PERSONAL TRAINING / 12 WEEKS</small><h1>FIT<span style="color:var(--accent)">.</span> <span class="version">03</span></h1><div class="muted">Сила · снижение жировой массы · восстановление</div></header><div id="metrics" class="grid" style="margin-top:16px"></div><div id="storage" class="storage"></div><nav class="tabs" id="tabs"></nav><div id="view"></div><div id="timerPanel" class="timer card row between" hidden><div><small style="color:#b7c9c3">Таймер отдыха</small><br><strong id="clock">02:00</strong></div><div class="row"><button onclick="startTimer(90)">90 с</button><button onclick="startTimer(120)">120 с</button><button onclick="stopTimer()">Стоп</button></div></div></main><script>
const E={ch:['Жим от груди','Грудь · трицепс · передняя дельта',null,10,12,3,'Лопатки к спинке, не поднимай плечи.'],lat:['Тяга верхнего блока','Широчайшие · бицепс',null,10,12,3,'Тяни к верхней части груди без раскачки.'],leg:['Жим ногами','Квадрицепсы · ягодицы',null,12,15,3,'Таз прижат, колени по линии носков.'],curl:['Сгибание ног сидя','Задняя поверхность бедра',null,12,15,3,'Совмести ось тренажёра с коленом.'],abs:['Пресс в тренажёре','Прямая мышца живота',null,10,12,2,'Скручивай корпус без рывка.'],row:['Горизонтальная тяга','Средняя часть спины · задняя дельта · бицепс',30,10,12,3,'Тяни локти назад, не раскачивайся.'],shoulder:['Жим на плечи','Дельты · трицепс',15,10,12,2,'Не прогибай поясницу.'],calf:['Подъём на носки стоя в тренажёре','Икроножные',null,12,15,2,'Начни с минимального сопротивления; плавная амплитуда.'],hip:['Ягодичный мост в тренажёре / без веса','Ягодицы · разгибатели бедра',null,10,12,2,'Не переразгибай поясницу.'],side:['Разведение рук в стороны','Средняя дельта',null,12,15,2,'Минимальный вес; без махов.'],core:['Боковая планка','Косые мышцы живота · стабилизаторы',0,20,30,2,'Секунды на каждую сторону.'],rear:['Обратная бабочка','Задняя дельта · верх спины',null,12,15,2,'Не поднимай плечи.']};
const ALT={ch:['Жим гантелей лёжа','Отжимания от высокой опоры'],lat:['Тяга верхнего блока нейтральным хватом','Подтягивания в гравитроне'],leg:['Наклонный жим ногами','Гакк-присед в тренажёре'],curl:['Сгибание ног лёжа','Сгибание одной ноги стоя'],abs:['Скручивания на коврике','Скручивания на верхнем блоке'],row:['Тяга в тренажёре с упором грудью','Тяга нижнего блока'],shoulder:['Жим гантелей сидя','Жим вверх в машине Смита'],calf:['Подъём на носки сидя','Подъём на носки стоя без веса','Подъём на носки в жиме ногами'],hip:['Ягодичный мост на полу','Разгибание бедра в тренажёре'],side:['Разведение гантелей в стороны','Разведение на нижнем блоке'],core:['Боковая планка с колен'],rear:['Разведение гантелей в наклоне с опорой','Обратное разведение на блоках']};
for(const [k,items] of Object.entries(ALT))items.forEach((name,i)=>{E[k+'x'+i]=[name,E[k][1],null,E[k][3],E[k][4],E[k][5],'Начни с минимального сопротивления, настрой тренажёр по инструкции. Оставляй 2–3 повторения в запасе.'];});
for(const k of ['chx1','absx0','calfx1','hipx0','corex0'])E[k][2]=0;
const root=k=>k.split('x')[0];function swapUI(k){let b=root(k);return `<div class="swap"><select aria-label="Замена упражнения" onchange="swapExercise('${k}',this.value)"><option value="">Заменить упражнение</option>${[b,...ALT[b].map((_,i)=>b+'x'+i)].filter(x=>x!==k).map(x=>`<option value="${x}">${E[x][0]}</option>`).join('')}</select></div>`}function swapExercise(k,n){if(!n||!s.draft||!E[n])return;if(s.draft.sets[k].some(a=>a.done)&&!confirm('Замена удалит уже отмеченные подходы этого упражнения. Продолжить?')){render();return}let entries=Object.entries(s.draft.sets).map(([key,a])=>key===k?[n,Array.from({length:E[n][5]},()=>({w:s.weights[n],r:E[n][3],rir:'',done:false}))]:[key,a]);s.draft.sets=Object.fromEntries(entries);s.preferred[root(k)]=n;save();render()}
const P={A:['leg','ch','lat','curl','side','abs','calf'],B:['leg','row','ch','hip','shoulder','rear','core']}; const provisional=['ch','row','shoulder','calf','hip','side','rear']; const date=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}; const initial={v:1,weights:Object.fromEntries(Object.entries(E).map(([k,v])=>[k,v[2]])),history:[],body:[],draft:null,goal:85};let s;try{s=JSON.parse(localStorage.getItem('fitness_v1'))||initial}catch{s=initial}function migrate(x){x.preferred=x.preferred||{};x.food=Array.isArray(x.food)?x.food:[];x.calGoal=x.calGoal||2000;x.proteinGoal=x.proteinGoal||150;for(const [k,e] of Object.entries(E))if(!(k in x.weights))x.weights[k]=e[2];return x} s=migrate(s);let tab='Тренировка',choice='A',end=0;let warning='';function storageStatus(){let el=document.getElementById('storage');if(el){el.className='storage'+(warning?' bad':'');el.innerHTML=warning?'<b>⚠ Сохранение недоступно</b><span>Сделай резервную копию</span>':'<b>● Локальная запись доступна</b><span>Резервная копия в настройках</span>'}}function save(){try{let v=JSON.stringify(s);localStorage.setItem('fitness_v1',v);if(localStorage.getItem('fitness_v1')!==v)throw Error();warning=''}catch{warning='Хранилище недоступно: экспортируй данные перед закрытием.'}storageStatus()}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function latest(){return [...s.body].sort((a,b)=>a.date.localeCompare(b.date)).at(-1)||{weight:"—"}}function render(){document.getElementById('metrics').innerHTML=`<div class="metric"><small>Вес тела</small><b>${latest().weight} кг</b></div><div class="metric"><small>Цель</small><b>${s.goal} кг</b></div><div class="metric"><small>Тренировок</small><b>${s.history.length}</b></div>`;document.getElementById('tabs').innerHTML=['Тренировка','Программа','Питание','История','Прогресс','Настройки'].map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${navIcon(t)}<span>${t}</span></button>`).join('');let v=document.getElementById('view');v.innerHTML=(warning?`<p class="danger">${warning}</p>`:'')+({Тренировка:work,Программа:plan,Питание:food,История:history,Прогресс:progress,Настройки:settings}[tab])()}

function navIcon(t){const icons={'Тренировка':'M4 8v8m4-11v14m8-14v14m4-11v8M8 12h8','Программа':'M5 5h14v14H5z M9 9h6m-6 4h6m-6 4h4','Питание':'M5 3v7q0 3 3 3t3-3V3M8 3v19M17 3q-3 5-3 10h4v9M18 3v10','История':'M4 12a8 8 0 1 1 2 6M4 5v7h7m1-5v5l4 2','Прогресс':'M4 4v16h16M7 15l4-5 4 2 5-6','Настройки':'M5 7h14M5 12h14M5 17h14M9 5v4m6 1v4m-5 1v4'};return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[t]}"/></svg>`}
function food(){let d=date(),a=s.food.filter(x=>x.date===d),k=a.reduce((n,x)=>n+x.k,0),p=a.reduce((n,x)=>n+x.p,0);return `<section class="hero-start"><div class="exercise-num">NUTRITION / TODAY</div><h2>Питание сегодня</h2><div class="grid"><div class="metric"><small>Ккал</small><b>${Math.round(k)}</b></div><div class="metric"><small>Остаток ккал</small><b>${Math.round(s.calGoal-k)}</b></div><div class="metric"><small>Белок, г</small><b>${Math.round(p)}</b></div></div><p class="muted">Цель: ${s.calGoal} ккал · ${s.proteinGoal} г белка</p><div class="bar"><i style="width:${Math.min(100,k/s.calGoal*100)}%"></i></div></section><section><h2>Добавить продукт</h2><label>Название</label><input id="fn" style="width:100%" placeholder="Куриная грудка"><div class="foodgrid" style="margin-top:10px">${[['fk','Ккал за порцию'],['fp','Белок, г'],['ff','Жиры, г'],['fc','Углеводы, г']].map(([id,l])=>`<div><label>${l}</label><input id="${id}" type="number" min="0" step="0.1" inputmode="decimal"></div>`).join('')}</div><p><button class="primary" onclick="addFood()">Добавить</button></p><small>Вводи значения на съеденную порцию. Жиры и углеводы можно оставить пустыми.</small></section><section><h2>Дневник питания</h2>${[...s.food].reverse().map(x=>`<div class="plan-card"><div class="row between"><b>${esc(x.name)}</b><button onclick="removeFood(${s.food.indexOf(x)})" aria-label="Удалить">×</button></div><small>${esc(x.date)} · ${x.k} ккал · Б ${x.p} г · Ж ${x.f??'—'} · У ${x.c??'—'}</small></div>`).join('')||'<p class="muted">Записей пока нет.</p>'}</section>`}
function addFood(){let val=id=>document.getElementById(id).value,n=val('fn').trim(),k=val('fk'),p=val('fp'),f=val('ff'),c=val('fc');if(!n||k===''||p===''||[k,p,f,c].some(x=>x!==''&&(!Number.isFinite(+x)||+x<0)))return alert('Введи название, калории и белок.');s.food.push({date:date(),name:n,k:+k,p:+p,f:f===''?null:+f,c:c===''?null:+c});save();render()}
function removeFood(i){if(confirm('Удалить запись?')){s.food.splice(i,1);save();render()}}

function start(){s.draft={date:date(),type:choice,sets:Object.fromEntries(P[choice].map(k=>s.preferred[k]||k).map(k=>[k,Array.from({length:E[k][5]},()=>({w:s.weights[k],r:E[k][3],rir:'',done:false}))])),note:''};save();render()}
function work(){if(!s.draft)return `<section class="hero-start"><div class="exercise-num">WORKOUT / TODAY</div><h2>Начать тренировку</h2><p>Чередуй A и B три раза в неделю, отдыхая между силовыми минимум один день.</p><div class="row">${['A','B'].map(k=>`<button class="${choice===k?'active':''}" onclick="choice='${k}';render()">Full Body ${k}</button>`).join('')}</div><p class="muted">7 упражнений · около 50–65 минут. Если мало времени, выполни первые 4–5.</p><button class="primary" onclick="start()">Начать ${choice}</button></section>`;let d=s.draft,all=Object.values(d.sets).flat(),n=all.filter(a=>a.done).length;return `<section><div class="row between"><h2>Full Body ${d.type}</h2><span>${n}/${all.length} подходов</span></div><div class="bar"><i style="width:${100*n/all.length}%"></i></div><p class="muted">Разминка 5–10 минут + лёгкие подводящие подходы. RIR — сколько повторений осталось в запасе.</p></section>`+Object.entries(d.sets).map(([k,sets])=>{let e=E[k];return `<section><div class="exercise-num">УПРАЖНЕНИЕ ${Object.keys(d.sets).indexOf(k)+1} / ${Object.keys(d.sets).length}</div><div class="row between" style="margin-top:8px"><h3>${e[0]}</h3><span class="tag">${e[3]}–${e[4]} ${root(k)==='core'?'сек':'повт.'}</span></div><p class="muted">${e[1]} · ${s.weights[k]==null?'подбор веса':s.weights[k]+' кг'}${provisional.includes(k)?' · пробный ориентир':''}</p><div class="set muted"><small>№</small><small>кг</small><small>${root(k)==='core'?'сек/стор.':'Повт.'}</small><small>RIR</small><small>✓</small></div>${sets.map((a,i)=>`<div class="set"><span>${i+1}</span><input aria-label="Вес" type="number" min="0" step="0.5" value="${a.w??''}" placeholder="кг" onchange="edit('${k}',${i},'w',this.value)"><input aria-label="Повторения" type="number" min="1" value="${a.r}" onchange="edit('${k}',${i},'r',this.value)"><select aria-label="Запас повторений" onchange="edit('${k}',${i},'rir',this.value)">${['',0,1,2,3,4,5].map(x=>`<option value="${x}" ${String(a.rir)===String(x)?'selected':''}>${x===''?'—':x}</option>`).join('')}</select><button class="${a.done?'done':''}" onclick="mark('${k}',${i})">${a.done?'✓':'○'}</button></div>`).join('')}${swapUI(k)}<details><summary>Техника</summary><p>${e[6]}</p></details></section>`}).join('')+`<section><label>Заметки / кардио</label><input style="width:100%" value="${esc(d.note)}" onchange="s.draft.note=this.value;save()" placeholder="Самочувствие, ходьба…"><p><button class="primary" onclick="finish()">Завершить и сохранить</button> <button onclick="cancelWorkout()">Отменить</button></p></section>`}
function edit(k,i,f,v){let a=s.draft.sets[k][i];a[f]=v===''?(f==='rir'?'':null):Number(v);save()}function mark(k,i){let a=s.draft.sets[k][i];if(!a.done&&(a.w===null||a.w<0||!a.r||a.r<1)){alert('Укажи фактический вес (0 — без веса) и повторения.');return}a.done=!a.done;save();if(a.done)startTimer(['leg','ch','lat','row','hip'].includes(k)?120:90);render()}
function finish(){let d=s.draft,sets={};for(let [k,a] of Object.entries(d.sets)){let b=a.filter(x=>x.done);if(b.length)sets[k]=b.map(({w,r,rir})=>({w,r,rir}))}if(!Object.keys(sets).length){alert('Отметь выполненные подходы.');return}if(!confirm('Сохранить только отмеченные подходы и завершить тренировку?'))return;s.history.push({date:d.date,type:d.type,sets,note:d.note});choice=d.type==='A'?'B':'A';s.draft=null;save();stopTimer();tab='История';render()}function cancelWorkout(){if(confirm('Удалить текущий незавершённый сеанс?')){s.draft=null;save();render()}}
function recommendation(k){let e=E[k],h=[...s.history].reverse().find(h=>h.sets[k]?.length);if(!h)return 'Подбери вес с запасом 2–3 повторения.';let a=h.sets[k].filter(x=>x.w===s.weights[k]);if(a.some(x=>x.rir===0))return 'Не повышать. При необходимости снизить вес или повторения.';if(a.length>=e[5]&&a.every(x=>x.r>=e[4]&&x.rir!==''&&x.rir!=null&&x.rir>=2))return 'Можно попробовать следующий минимальный шаг тренажёра.';return 'Сохраняй вес; повышай после всех подходов с запасом 2–3.'}
function plan(){return `<section><h2>12 недель · Full Body A/B</h2><p>Неделя 1: A–B–A; неделя 2: B–A–B. Первые 2 недели — по 2 рабочих подхода, если восстановление недостаточное. Далее используй объём в таблице. Не работай до отказа.</p></section>`+Object.entries(P).map(([p,ks])=>`<section><h2>Тренировка ${p}</h2>${ks.map(k=>s.preferred[k]||k).map(k=>`<div class="plan-card"><b>${E[k][0]}</b><small>${E[k][1]}</small><div class="load">${s.weights[k]==null?'Подбор веса':s.weights[k]+' кг'} · ${E[k][5]} × ${E[k][3]}–${E[k][4]} ${root(k)==='core'?'сек/стор.':''}</div><small>${recommendation(k)}</small><br><small>Замены: ${[root(k),...ALT[root(k)].map((_,i)=>root(k)+'x'+i)].filter(x=>x!==k).map(x=>E[x][0]).join(' · ')}</small></div>`).join('')}</section>`).join('')+`<section><h2>Покрытие мышц</h2><table>${[['Грудь','A + B'],['Широчайшие и средняя часть спины','A + B'],['Передняя / средняя / задняя дельта','A + B'],['Бицепс и трицепс','В тягах и жимах'],['Квадрицепсы, ягодицы','A + B'],['Задняя поверхность бедра','A'],['Икры','A'],['Корпус','A + B']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table><p class="muted">Отдельная нагрузка на руки необязательна. Приоритет — восстановление и техника. При боли в груди, необычной одышке или головокружении прекрати нагрузку.</p></section>`}
function history(){return [...s.history].reverse().map(h=>`<section><h3>${esc(h.date)} · ${esc(h.type)}</h3><table><tr><th>Упражнение</th><th>Подходы (кг × повт.)</th></tr>${Object.entries(h.sets).map(([k,a])=>`<tr><td>${E[k]?.[0]||esc(k)}</td><td>${a.map(x=>`${x.w} × ${x.r??'?'}`).join(' / ')}</td></tr>`).join('')}</table><p class="muted">${esc(h.note)}</p></section>`).join('')||'<p>История пока пуста.</p>'}
function chart(a){if(!a.length)return '<p>Нет данных</p>';let min=Math.min(...a.map(x=>x.y)),max=Math.max(...a.map(x=>x.y));let xy=a.map((x,i)=>[35+i*300/Math.max(1,a.length-1),20+(max-x.y)*110/Math.max(1,max-min)]);return `<svg viewBox="0 0 360 165" role="img" aria-label="График динамики"><path d="M35 15V135H340" fill="none" stroke="#aab6c1"/><polyline points="${xy.map(x=>x.join(',')).join(' ')}" fill="none" stroke="#d9fa68" stroke-width="3"/>${xy.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="4" fill="#d9fa68"/>${i===0||i===a.length-1?`<text x="${x}" y="${y-8}" font-size="11" text-anchor="middle" fill="#172331">${a[i].y}</text>`:''}`).join('')}<text x="35" y="153" font-size="10">${esc(a[0].d)}</text><text x="340" y="153" text-anchor="end" font-size="10">${esc(a.at(-1).d)}</text></svg>`}
function progress(){let a=[...s.body].sort((a,b)=>a.date.localeCompare(b.date));return `<section><h2>Вес и талия</h2><div class="row"><div><label>Дата</label><input id="bd" type="date" value="${date()}"></div><div><label>Вес, кг</label><input id="bw" type="number" step="0.1" min="1" style="width:95px" value="${latest().weight}"></div><div><label>Талия, см</label><input id="bt" type="number" step="0.1" min="1" style="width:95px"></div></div><p><button class="primary" onclick="bodyAdd()">Сохранить замер</button></p>${chart(a.map(x=>({d:x.date,y:x.weight})))}<h3>Талия</h3>${chart(a.filter(x=>x.waist!=null).map(x=>({d:x.date,y:x.waist})))}<p class="muted">Взвешивайся утром; оценивай тренд за несколько недель, а не отдельное измерение.</p></section><section><h2>Силовой прогресс</h2><select id="ex" onchange="strength(this.value)">${Object.keys(E).map(k=>`<option value="${k}">${E[k][0]}</option>`).join('')}</select><div id="strength">${strengthChart('ch')}</div></section>`}function strengthChart(k){return chart([...s.history].sort((a,b)=>a.date.localeCompare(b.date)).filter(h=>h.sets[k]?.some(x=>x.r!=null)).map(h=>({d:h.date,y:Math.max(...h.sets[k].filter(x=>x.r!=null).map(x=>x.w))})))+'<small>Максимальный фактически выполненный вес за тренировку; сравнивай вместе с повторениями и запасом.</small>'}function strength(k){document.getElementById('strength').innerHTML=strengthChart(k)}function bodyAdd(){let d=document.getElementById('bd').value,w=Number(document.getElementById('bw').value),t=document.getElementById('bt').value;if(!d||w<=0||(t&&Number(t)<=0))return alert('Проверь значения');s.body=s.body.filter(x=>x.date!==d);s.body.push({date:d,weight:w,waist:t?Number(t):null});save();render()}
function settings(){return `<section><h2>Рабочие веса</h2><p class="muted">Изменяй после оценки техники и RIR. Пустое значение — подбор на месте.</p>${Object.keys(E).map(k=>`<div class="row between" style="margin:8px 0"><span>${E[k][0]}</span><input aria-label="${E[k][0]}" type="number" min="0" step="0.5" style="width:85px" value="${s.weights[k]??''}" onchange="weightEdit('${k}',this.value)"></div>`).join('')}<label>Цель калорий, ккал</label><input type="number" min="1" value="${s.calGoal}" onchange="if(+this.value>0){s.calGoal=+this.value;save()}"><label>Цель белка, г</label><input type="number" min="1" value="${s.proteinGoal}" onchange="if(+this.value>0){s.proteinGoal=+this.value;save()}"><label>Целевой вес тела</label><input type="number" min="1" value="${s.goal}" onchange="if(+this.value>0){s.goal=+this.value;save();render()}"></section><section><h2>Хранение на iPhone</h2><p>Локальное сохранение зависит от браузера. Просмотр HTML через «Файлы» может не поддерживать историю. Для надёжного переноса сохраняй JSON в «Файлы» / iCloud Drive.</p><div class="row"><button onclick="shareBackup()">Поделиться копией</button></div><h2 style="margin-top:20px">Резервная копия</h2><p>Данные хранятся в браузере. Экспортируй их регулярно: очистка браузера или открытие в другом приложении может привести к потере истории.</p><div class="row"><button onclick="exportData()">Экспорт JSON</button><button onclick="document.getElementById('imp').click()">Импорт JSON</button><input id="imp" hidden type="file" accept=".json,application/json" onchange="importData(this.files[0])"></div></section>`}function weightEdit(k,v){if(v!==''&&(!Number.isFinite(+v)||+v<0))return;s.weights[k]=v===''?null:+v;save()}async function shareBackup(){let f=new File([JSON.stringify(s,null,2)],'fitness_backup_'+date()+'.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){if(e.name!=='AbortError')exportData()}}else exportData()}function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.href=u;a.download='fitness_backup_'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(f){if(!f)return;try{let x=JSON.parse(await f.text());if(x.v!==1||!Array.isArray(x.history)||!Array.isArray(x.body)||!x.weights||!x.history.every(h=>h.sets&&Object.values(h.sets).every(Array.isArray)))throw Error();if(confirm('Заменить текущие данные резервной копией?')){s=migrate(x);save();render()}}catch{alert('Некорректный файл резервной копии')}}function startTimer(n){document.getElementById('timerPanel').hidden=false;end=Date.now()+n*1000;tick()}function stopTimer(){document.getElementById('timerPanel').hidden=true;end=0;document.getElementById('clock').textContent='00:00'}function tick(){if(!end)return;let n=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById('clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(!n){end=0;if(navigator.vibrate)navigator.vibrate(250)}}setInterval(tick,250);let last=s.history.at(-1);choice=last?.type==='A'?'B':'A';save();render();</script><script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline cache unavailable',e));}</script></html>
